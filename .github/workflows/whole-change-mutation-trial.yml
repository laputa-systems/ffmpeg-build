name: FFmpeg controller mutation

on: pull_request

permissions:
  contents: read

concurrency:
  group: whole-change-mutation-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scopes: ${{ steps.select.outputs.scopes }}
      buildlib: ${{ steps.pin.outputs.rev }}
      runners: ${{ steps.select.outputs.runners }}
      wheel: ${{ steps.wheel.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.7
      - id: pin
        run: printf 'rev=%s\n' "$(< .github/mutation-buildlib-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: laputa-systems/buildlib
          ref: ${{ steps.pin.outputs.rev }}
          path: .work/buildlib
          persist-credentials: false
      - name: Check the mutation selection contract
        run: uv run --frozen --no-sync --python 3.15.2 python -m unittest discover -s tests -p test_mutation_selection.py
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scopes=$(uv run --frozen --no-sync --python 3.15.2 python .github/scripts/select_mutation_scopes.py "$BASE" .work/buildlib/scripts)
          if [ "$scopes" = '[]' ]; then
            scopes='["documentation"]'
          fi
          printf 'scopes=%s\n' "$scopes" >> "$GITHUB_OUTPUT"
          printf 'runners=["ubuntu-26.04","ubuntu-26.04-arm","xcode-27"]\n' >> "$GITHUB_OUTPUT"
          printf 'Selected scopes %s\n' "$scopes"

      - id: wheel
        if: steps.select.outputs.scopes != '["documentation"]'
        run: |
          wheel=$(uv run --frozen --no-sync --python 3.15.2 python -c 'from bootstrap import _wheel; print(_wheel())')
          printf 'path=%s\nartifact=ffmpeg-buildlib-wheel-%s\n' "$wheel" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.wheel.outputs.artifact != ''
        with:
          name: ${{ steps.wheel.outputs.artifact }}
          path: ${{ steps.wheel.outputs.path }}
          if-no-files-found: error
          retention-days: 2

  prepare:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.7
      - if: needs.plan.outputs.wheel != ''
        run: uv sync --frozen --python 3.15.2

  native:
    needs: [plan, prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan.outputs.scopes) }}
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: laputa-systems/buildlib
          ref: ${{ needs.plan.outputs.buildlib }}
          path: .work/buildlib
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.wheel != ''
        with:
          name: ${{ needs.plan.outputs.wheel }}
          path: .work/cache/sources
      - name: Measure selected mutations in the committed archive
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SCOPE: ${{ matrix.scope }}
        run: make mutants-diff MUTATION_BASE="$BASE" MUTATION_SCOPE="$SCOPE" MUTATION_BUILDLIB=.work/buildlib

  whole-change:
    if: always()
    needs: [plan, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      NATIVE: ${{ needs.native.result }}
    steps:
      - run: |
          test "$PLAN" = success
          test "$NATIVE" = success
