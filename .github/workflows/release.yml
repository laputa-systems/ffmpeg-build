name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read upstream version
        id: version
        run: echo "version=$(python3 build.py version)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: python3 -m unittest discover -s tests

  fixtures:
    name: Fixtures
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Generate fixtures with Alpine FFmpeg 9.0.2
        run: scripts/linux-fixtures.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: .work/fixtures
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, fixtures]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: xcode-27
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select Xcode
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install build tools
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install meson ninja pkgconf

      - name: Cache sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/cache/sources
          key: ffmpeg-sources-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('sources.lock.json', 'profiles/*.json', 'build.py', 'scripts/*.sh', 'docker/Dockerfile') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: .work/fixtures

      - name: Build, audit, and package
        run: make build TARGET="$TARGET"

      - name: Run tools workflows
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          tests/tools-workflows.sh ".work/stage/$TARGET/tools"
          TOOLS_WORK=.work/tmp/tools-workflows-runtime tests/tools-workflows.sh ".work/stage/$TARGET/runtime"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.manifest.json
          if-no-files-found: error

  assemble:
    name: Assemble
    needs: [preflight, build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: .work/artifacts

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 .github/scripts/assemble_release.py .work/artifacts release "$VERSION" "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.target }}
    needs: [preflight, assemble]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: xcode-27
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select Xcode
        if: matrix.target == 'aarch64-apple-darwin'
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install pkg-config
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install pkgconf

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: .work/fixtures

      - name: Check release bytes on macOS
        if: matrix.target == 'aarch64-apple-darwin'
        run: (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Check release bytes on Linux
        if: matrix.target != 'aarch64-apple-darwin'
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Verify published bytes
        run: make verify TARGET="$TARGET"

  publish:
    name: Create pre-release
    needs: [preflight, assemble, verify]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check release bytes
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          sed 's/^[0-9a-f]*  //' release/SHA256SUMS | LC_ALL=C sort -c
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "$(($(wc -l < release/SHA256SUMS) + 1))"

      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" release/*

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          cmp release/SHA256SUMS published/SHA256SUMS
