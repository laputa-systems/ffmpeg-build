[project]
name = "ffmpeg-build"
version = "0.1.0"
description = "Pinned FFmpeg builds"
requires-python = ">=3.15"
dependencies = ["laputa-buildlib==0.3.1"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[dependency-groups]
dev = [
    "coverage==7.17.3",
    "mutmut==3.8.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.101",
    "uv==0.13.7",
]

[tool.ruff]
target-version = "py315"

[tool.ty.rules]
unsound-return-statement = "error"

[tool.ty.environment]
root = [".", "scripts", "tests"]
python-version = "3.15"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = [".", ".github/scripts"]
omit = [".work/*", ".venv/*", "tests/*"]
data_file = ".work/coverage/.coverage"
relative_files = true

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
